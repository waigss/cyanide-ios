name: Build Cyanide IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package IPA
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-IPA
          path: build/Cyanide.ipa
